# mpv (D-016): always fullscreen; Hyprland sends it to workspace 6 (video, D-015).
# scripts/blur-edges.lua (occivink/mpv-scripts, Unlicense) fills the side bars with a blurred
# copy of the video edges (fullscreen only, its default).
fs=yes

# YouTube via yt-dlp: YouTube now answers 403 to whole-file requests (it wants chunked
# "&range=" requests, which mpv/ffmpeg do not make). HLS (m3u8) formats are already
# chunked and play fine. Capped at 1440 p (screen height; the side-fill filter means CPU decoding).
ytdl-format=bestvideo[height<=1440][protocol^=m3u8]+bestaudio[protocol^=m3u8]/best[protocol^=m3u8]/best

# Hardware decoding on the NVIDIA GPU, copied back to RAM so the side-fill filter
# (blur-edges / ambiance, lavfi) still works. mpv falls back to software if unsupported.
hwdec=nvdec-copy

# HDR (D-029): pass the video's own colorspace to Hyprland so it can switch to HDR
# (Hyprland wiki: needed for cm_auto_hdr with mpv > 0.40).
target-colorspace-hint-mode=source
